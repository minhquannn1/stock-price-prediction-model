[project]
name = "veritas"
version = "0.1.0"
description = "Next-day price prediction for the S&P 500, NVDA, and JPM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "yfinance>=1.4.1",
]

[project.scripts]
predict = "veritas.predict:main"
backtest = "veritas.backtest:main"
hindcast = "veritas.hindcast:main"
papertrade = "veritas.papertrade:main"
eda = "veritas.eda:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[build-system]
requires = ["uv_build>=0.7.19"]
build-backend = "uv_build"
